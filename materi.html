</head>
<body class="layar-penuh panggung">

<nav class="navbar">

  <div class="nav-right">

    <div class="avatar-btn" id="navAvatar" title="Profil">👤</div>
  </div>
</nav>

<div class="wrap">

  <!-- ===================== PANEL KOMIK ===================== -->
  <section class="comic-stage">

    <div class="comic-panel" id="scene">
      <!-- kotak keterangan ala komik (judul majas yang lagi dibahas) -->
      <div class="comic-caption" id="comicCaption">Ayo Belajar!</div>

      <!-- murid (Dito, Sari, Bima, Keke) -> diisi JS -->
      <div class="kelompok-murid" id="audienceRow"></div>

      <!-- guru -> diisi JS, jalan masuk dari kiri -->
      <div class="tokoh guru" id="teacherSlot"></div>

      <!-- balon kata GURU: bentuk lonjong + ekor digambar pakai SVG -->
      <div class="speech-bubble bubble-guru" id="bubbleGuru">
        <svg class="bubble-shape" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
          <!-- lapis 1: garis tepi (ellipse + ekor) -->
          <g class="bubble-stroke">
            <ellipse cx="50" cy="50" rx="49" ry="48"/>
            <path class="tail-desktop" d="M20 84 Q14 108 8 123 Q22 108 36 92 Z"/>
            <path class="tail-mobile" d="M30 90 Q36 115 39 137 Q44 112 46 96 Z"/>
          </g>
          <!-- lapis 2: isi putih, nutupin garis di sambungan ekor biar nyatu -->
          <g class="bubble-fill">
            <ellipse cx="50" cy="50" rx="49" ry="48"/>
            <path class="tail-desktop" d="M20 84 Q14 108 8 123 Q22 108 36 92 Z"/>
            <path class="tail-mobile" d="M30 90 Q36 115 39 137 Q44 112 46 96 Z"/>
          </g>
        </svg>
        <p class="speech-text"><span><span class="speech-isi"></span><span class="speech-cursor">|</span></span></p>
      </div>

      <!-- balon kata MURID (Dito), ekornya nunjuk ke kepala Dito -->
      <div class="speech-bubble bubble-murid" id="bubbleMurid">
        <svg class="bubble-shape" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
          <g class="bubble-stroke">
            <ellipse cx="50" cy="50" rx="49" ry="48"/>
            <path class="tail-desktop" d="M24 88 Q28 112 29 136 Q36 112 40 95 Z"/>
            <path class="tail-mobile" d="M26 88 Q30 112 32 135 Q38 112 42 95 Z"/>
          </g>
          <g class="bubble-fill">
            <ellipse cx="50" cy="50" rx="49" ry="48"/>
            <path class="tail-desktop" d="M24 88 Q28 112 29 136 Q36 112 40 95 Z"/>
            <path class="tail-mobile" d="M26 88 Q30 112 32 135 Q38 112 42 95 Z"/>
          </g>
        </svg>
        <p class="speech-text"><span><span class="speech-isi"></span><span class="speech-cursor">|</span></span></p>
      </div>
    </div>

    <!-- tombol kontrol + titik progres di tengah -->
    <div class="comic-controls">
      <button class="comic-btn comic-btn-ghost" id="btnPrev">
        <i class="fa-solid fa-arrow-left"></i> <span class="btn-label">Sebelumnya</span>
      </button>

      <div class="comic-progress" id="comicProgress"></div>

      <div class="comic-controls-right">
        <button class="comic-btn comic-btn-mute" id="btnMute" title="Nyalakan/matikan suara">
          <i class="fa-solid fa-volume-high" id="muteIcon"></i>
        </button>
        <button class="comic-btn comic-btn-primary" id="btnAction">
          Siap! <i class="fa-solid fa-arrow-right"></i>
        </button>
      </div>
    </div>

  </section>
  <!-- =================== /PANEL KOMIK ======================= -->

</div>
