<div class="wrap">

  <!-- ===================== PANEL KOMIK ===================== -->
  <section class="comic-stage">

    <div class="comic-panel">
      <!-- kotak keterangan: judul video -->
      <div class="comic-caption" id="comicCaption">Video Majas</div>

      <!-- layar video: awalnya cover + tombol play, diklik -> iframe (diisi JS) -->
      <div class="layar-video" id="layarVideo"></div>

      <!-- 2 bocah yang nemenin nonton (diisi JS) -->
      <div class="tokoh bocah bocah-kiri" id="bocahKiri"></div>
      <div class="tokoh bocah bocah-kanan" id="bocahKanan"></div>

      <!-- balon kata ajakan (keluar dari bocah kiri) -->
      <div class="speech-bubble bubble-ajakan" id="bubbleAjakan">
        <svg class="bubble-shape" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
          <g class="bubble-stroke">
            <ellipse cx="50" cy="50" rx="49" ry="48"/>
            <path class="tail-desktop" d="M32 92 Q37 120 40 145 Q44 120 48 96 Z"/>
            <path class="tail-mobile" d="M26 90 Q30 102 32 113 Q36 102 40 95 Z"/>
          </g>
          <g class="bubble-fill">
            <ellipse cx="50" cy="50" rx="49" ry="48"/>
            <path class="tail-desktop" d="M32 92 Q37 120 40 145 Q44 120 48 96 Z"/>
            <path class="tail-mobile" d="M26 90 Q30 102 32 113 Q36 102 40 95 Z"/>
          </g>
        </svg>
        <p class="speech-text"><span id="teksAjakan"></span></p>
      </div>
    </div>

  </section>
  <!-- =================== /PANEL KOMIK ======================= -->
